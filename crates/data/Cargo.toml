[package]
name = "deimos-data"
version = "0.0.0"
edition = "2021"

[lib]
path = "./lib.rs"

[dependencies]
d3d12 = { path = "../d3d12", optional = true }
deimos-core = { path = "../core", optional = true }

anyhow.workspace = true
assert-offset = "0.1"
bitflags = "2"
glam.workspace = true
paste = "1"
tiger-pkg.workspace = true
tiger-parse.workspace = true
int-enum = "1.2.0"
ahash = "0.8"
rayon.workspace = true

[features]
default = ["renderer"]
renderer = ["dep:d3d12"]
cpu = []
examples = ["dep:deimos-core"]

[[example]]
name = "extract_dialogue"
required-features = ["examples"]
